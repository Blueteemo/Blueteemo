name: Refresh profile content

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-content-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Update blog posts without committing
        run: python scripts/update_blog_posts.py

      - name: Generate language cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile_languages.py

      - name: Fetch and validate trophy card
        env:
          TROPHY_URL: >-
            https://trophy.ryglcloud.net/?username=${{ github.repository_owner }}&theme=onedark&no-frame=true&column=7&title=-Followers,-Reviews
        run: |
          tmp_file=$(mktemp)
          trap 'rm -f "$tmp_file"' EXIT
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 "$TROPHY_URL" -o "$tmp_file"
          grep -q '<svg' "$tmp_file"
          grep -q '>Repositories<' "$tmp_file"
          grep -q '>Stars<' "$tmp_file"
          test "$(wc -c < "$tmp_file")" -gt 10000
          if grep -Eiq '<script|<foreignObject|javascript:| on[a-z]+=' "$tmp_file"; then
            echo "::error::Downloaded trophy SVG contains unsafe markup"
            exit 1
          fi
          python3 scripts/render_profile_trophies.py "$tmp_file" .github/assets

      - name: Commit all changed profile content once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/assets/languages-light.svg .github/assets/languages-dark.svg
          git add .github/assets/trophy.svg .github/assets/trophy-light.svg .github/assets/trophy-mobile-dark.svg .github/assets/trophy-mobile-light.svg
          if git diff --cached --quiet; then
            echo "No profile changes"
            exit 0
          fi
          git commit -m "chore(profile): refresh profile content"
          git pull --rebase origin main
          git push origin HEAD:main
