name: Cleanup failed workflow runs

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const workflows = ["blog-post-workflow.yml", "trophy.yml"];
            let deleted = 0;
            for (const workflow_id of workflows) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id,
                  status: "failure",
                  per_page: 100,
                },
              );
              for (const run of runs) {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                deleted += 1;
              }
            }
            core.notice(`Deleted ${deleted} failed workflow run(s).`);
