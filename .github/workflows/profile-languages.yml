name: Update profile language statistics
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-language-statistics
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recalculate language statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile_languages.py
      - name: Commit only changed cards
        run: |
          if git diff --quiet -- .github/assets/languages-light.svg .github/assets/languages-dark.svg; then
            echo "No card changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/languages-light.svg .github/assets/languages-dark.svg
          git commit -m "chore(profile): refresh language statistics"
          git push
