name: Generate Profile Trophy

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0:00 运行
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Trophy SVG
        uses: soulteary/github-profile-trophy@v2.0.1
        with:
          username: ${{ github.repository_owner }}
          theme: onedark
          no-frame: true
          column: 6
          exclude-title: 'Followers|Review'
      
      - name: Commit and push trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f trophy.svg
          git diff --staged --quiet || git commit -m "ci: auto-update profile trophy $(date +'%Y-%m-%d')"
          git push